name: IssuePilot
description: 새 이슈를 LLM으로 분류하고 중복 이슈와 담당자를 찾아 라벨과 코멘트로 남깁니다
author: Izac626
branding:
  icon: tag
  color: blue

inputs:
  anthropic-api-key:
    description: Anthropic API 키. 저장소 Secrets에 넣고 넘겨 주세요
    required: true
  github-token:
    description: 이슈를 읽고 라벨·코멘트를 쓸 토큰. issues write 권한이 필요합니다
    default: ${{ github.token }}
  issue-number:
    description: 분석할 이슈 번호. 비워 두면 이벤트의 이슈를 씁니다
    default: ${{ github.event.issue.number }}
  model:
    description: Claude 모델 ID
    default: claude-opus-5-5
  effort:
    description: low, medium, high 중 하나
    default: low

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"
    - name: Install pinned dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet --disable-pip-version-check -r "$ACTION_PATH/requirements-run.txt"
    # 임베딩 모델(약 220MB)을 실행마다 내려받지 않도록 보관한다
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/issuepilot
        key: issuepilot-embed-minilm-l12-v2
    - name: Run IssuePilot
      shell: bash
      # 입력값은 스크립트에 직접 넣지 않고 환경 변수로만 넘긴다 (스크립트 주입 방지).
      # 이슈 제목·본문은 코드가 API로 읽는다.
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        PILOT_MODEL: ${{ inputs.model }}
        PILOT_EFFORT: ${{ inputs.effort }}
        ACTION_PATH: ${{ github.action_path }}
      run: cd "$ACTION_PATH" && PILOT_EMBED_CACHE="$HOME/.cache/issuepilot" python -m issuepilot
