name: IssuePilot

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 다시 분석할 이슈 번호
        required: true
        type: number

# 기본 권한을 모두 끄고 job에서 필요한 것만 연다
permissions: {}

concurrency:
  group: issue-pilot-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    # 봇이 만든 이슈에는 반응하지 않는다 (자기 호출·자동화 루프 방지)
    if: github.event_name == 'workflow_dispatch' || github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .issuepilot
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .issuepilot/requirements-run.txt
      - name: Install pinned dependencies
        run: pip install --quiet -r .issuepilot/requirements-run.txt
      # 임베딩 모델(약 220MB)을 실행마다 내려받지 않도록 보관한다
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .issuepilot/.cache/fastembed
          key: issuepilot-embed-minilm-l12-v2
      - name: Run IssuePilot
        working-directory: .issuepilot
        # 이슈 제목·본문은 워크플로 식에 넣지 않는다. 번호만 환경 변수로 넘기고
        # 내용은 코드가 API로 읽는다 (스크립트 주입 방지).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: python -m issuepilot
